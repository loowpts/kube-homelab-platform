# --- Шаблон подготовки Terraform ---
# Секреты передаются через TF_VAR_* (CI/CD Variables проекта, masked + protected),
# несекретные параметры стенда лежат в IaC/terraform/homelab.auto.tfvars.
.terraform_prepare:
  image:
    name: hashicorp/terraform:1.16.4
    entrypoint: [""]
  script:
    - export TF_VAR_proxmox_token="${PROXMOX_TOKEN}"
    - export TF_VAR_proxmox_ssh_password="${PROXMOX_SSH_PASSWORD}"
    - export TF_VAR_user_password="${VM_USER_PASSWORD}"
    - export TF_VAR_vm_ssh_public_key="${VM_SSH_PUBLIC_KEY}"
    - if [ -n "${PROXMOX_URL}" ]; then export TF_VAR_proxmox_url="${PROXMOX_URL}"; fi

    # State — в этом же проекте (Operate -> Terraform states). Доступ — встроенным
    # CI_JOB_TOKEN с правами того, кто запустил пайплайн: отдельный токен не нужен.
    - export TF_STATE_ADDRESS="${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    # Логин/пароль — через окружение, не через -backend-config: иначе Terraform
    # сохраняет их в tfplan, и terraform_apply берёт оттуда CI_JOB_TOKEN джобы
    # terraform_plan, который к этому моменту уже недействителен ("requires auth").
    - export TF_HTTP_USERNAME="gitlab-ci-token"
    - export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
    - >
      terraform -chdir=${TF_ROOT} init -input=false -plugin-dir="${TF_ROOT}/providers"
      -backend-config="address=${TF_STATE_ADDRESS}"
      -backend-config="lock_address=${TF_STATE_ADDRESS}/lock"
      -backend-config="unlock_address=${TF_STATE_ADDRESS}/lock"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"
