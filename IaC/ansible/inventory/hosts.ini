[all]
node-master1 ansible_host=192.168.0.100 ip=192.168.0.100 etcd_member_name=etcd1
node-master2 ansible_host=192.168.0.101 ip=192.168.0.101 etcd_member_name=etcd2
node-master3 ansible_host=192.168.0.102 ip=192.168.0.102 etcd_member_name=etcd3
node-worker1 ansible_host=192.168.0.110 ip=192.168.0.110
node-worker2 ansible_host=192.168.0.111 ip=192.168.0.111
node-infra   ansible_host=192.168.0.112 ip=192.168.0.112
node-lb1     ansible_host=192.168.0.10
node-lb2     ansible_host=192.168.0.11


[kube_control_plane]
node-master1
node-master2
node-master3

[etcd:children]
kube_control_plane

[kube_node]
node-worker1
node-worker2
node-infra

# Роли нод в Kubernetes (роль 01-node-roles): infra — платформа, workers — приложения
[infra]
node-infra

[workers]
node-worker1
node-worker2

[k8s_cluster:children]
kube_control_plane
kube_node
infra

[lb]
node-lb1
node-lb2

# Хост Proxmox — только для playbooks/backup-nfs.yml (NFS для бэкапов).
# Не входит в site.yml и не трогается из CI: у CI нет root-доступа к гипервизору.
[proxmox]
node-pve ansible_host=192.168.0.143 ansible_user=root
