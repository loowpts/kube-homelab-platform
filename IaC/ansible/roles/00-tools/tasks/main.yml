---
- name: Check Helm binary
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_bin

- name: Get installed Helm version
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_installed
  changed_when: false
  # Только чтение — выполняем и в --check, иначе роль решит, что Helm нет
  check_mode: false
  when: helm_bin.stat.exists

- name: Install Helm {{ helm_version }}
  when: not helm_bin.stat.exists or not helm_installed.stdout.startswith(helm_version ~ '+')
  become: true
  block:
    - name: Download Helm archive (checksum verified)
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}.tar.gz"
        checksum: "sha256:{{ helm_sha256 }}"
        mode: "0644"

    - name: Unpack Helm archive
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true
