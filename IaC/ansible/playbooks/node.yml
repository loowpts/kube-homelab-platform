---

- name: Базовая настройка нод
  hosts: k8s_cluster
  become: true

  tasks:
    - name: Отключить swap
      command: swapoff -a
      changed_when: false

    - name: Убрать swap из fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load required kernel modules for networking
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set sysctl parameters for networking (IPv4 forwarding)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: no
      with_dict:
        net.bridge.bridge-netfilter-call-iptables: 1
        net.bridge.bridge-netfilter-call-ip6tables: 1
        net.ipv4.ip_forward: 1
