# Собственный CA кластера: ClusterIssuer homelab-ca выпускает сертификаты для Ingress
# (аннотация cert-manager.io/cluster-issuer: homelab-ca).
# Браузер доверяет им после импорта корневого сертификата — см. IaC/README.md → Ingress.
#
# Волна 1: после того как чарт cert-manager (CRD и вебхук) готов.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca
  duration: 87600h # 10 лет: корень импортируется в браузер один раз
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ca:
    # Secret ищется в namespace cert-manager (cluster resource namespace)
    secretName: homelab-ca
