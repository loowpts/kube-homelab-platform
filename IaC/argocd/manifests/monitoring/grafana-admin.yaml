# Логин/пароль администратора Grafana из Vault (secret/grafana).
# Без него чарт генерирует случайный пароль при каждом рендере в ArgoCD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    # Secret должен появиться раньше, чем Grafana на него сошлётся
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: secret/grafana
        property: admin-password
