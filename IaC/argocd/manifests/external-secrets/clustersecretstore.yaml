# Доступ ESO к Vault для всех namespace (Kubernetes auth, роль external-secrets-role — IaC/vault/bootstrap.sh).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    # CRD ставится чартом в той же синхронизации — не падать на dry-run при установке с нуля
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-role"
          # ServiceAccount контроллера ESO — на него выдана роль в Vault
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
