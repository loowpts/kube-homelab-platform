# External Secrets Operator — секреты из Vault в Secret'ы кластера.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valuesObject:
          installCRDs: true
          # Платформа — на infra; global действует на контроллер, webhook и cert-controller
          resources:
            requests: {cpu: 10m, memory: 64Mi}
          webhook:
            resources:
              requests: {cpu: 10m, memory: 48Mi}
          certController:
            resources:
              requests: {cpu: 10m, memory: 64Mi}
          global:
            nodeSelector:
              node-role.kubernetes.io/infra: ""
            tolerations:
              - key: node-role.kubernetes.io/infra
                operator: Exists
                effect: NoSchedule

    # ClusterSecretStore vault-backend — общий для всех окружений
    - repoURL: http://192.168.0.21/loowpts/homelab.git
      targetRevision: main
      path: IaC/argocd/manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD ESO слишком большие для client-side apply
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # caBundle вебхуков и conversion-вебхука CRD проставляет cert-controller ESO
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
