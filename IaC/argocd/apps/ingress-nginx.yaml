# ingress-nginx — единая точка входа по имени хоста: HAProxy <VIP>:80/443 -> NodePort 31082/30214.
# Имена вида <сервис>.192.168.0.15.nip.io (nip.io резолвит их в VIP без своего DNS).
# NodePort'ы зафиксированы — на них смотрит HAProxy (lb_services в group_vars/lb.yml).
# Проект ingress-nginx выведен из поддержки — в планах переход на Gateway API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          kind: Deployment
          config:
            # HTTP работает и для хостов с TLS: сертификаты от собственного CA,
            # и без его импорта браузер ругался бы на каждый редирект на https
            ssl-redirect: "false"
            # Иначе после одного визита по https браузер запомнит HSTS и перестанет
            # открывать http, а сертификат может быть ещё не импортирован
            hsts: "false"
          replicaCount: 1
          # Размещение на infra; ниже в файле — ссылки *infraNodeSelector / *infraTolerations
          nodeSelector: &infraNodeSelector
            node-role.kubernetes.io/infra: ""
          tolerations: &infraTolerations
            - key: node-role.kubernetes.io/infra
              operator: Exists
              effect: NoSchedule
          admissionWebhooks:
            patch:
              nodeSelector: *infraNodeSelector
              tolerations: *infraTolerations
          service:
            type: NodePort
            nodePorts:
              http: 31082
              https: 30214
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # caBundle проставляет job admission-webhook-patch
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
