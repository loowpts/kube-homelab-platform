# metrics-server: метрики CPU/памяти подов для HPA и kubectl top.
# Ставится через ArgoCD, а не kubespray (metrics_server_enabled: false в inventory),
# чтобы в кластере был ровно один metrics-server.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.14.0
    helm:
      releaseName: metrics-server
      valuesObject:
        args:
          # Сертификаты kubelet в кластере kubespray самоподписанные
          # (kubelet_rotate_server_certificates не включён)
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP
        # Платформа — на infra
        nodeSelector:
          node-role.kubernetes.io/infra: ""
        tolerations:
          - key: node-role.kubernetes.io/infra
            operator: Exists
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
