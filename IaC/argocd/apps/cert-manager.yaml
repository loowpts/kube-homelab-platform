# cert-manager + собственный CA (ClusterIssuer homelab-ca) для TLS на Ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valuesObject:
          installCRDs: true
          # Платформа — на infra (taint node-role.kubernetes.io/infra, см. IaC/README.md → Размещение)
          # Размещение на infra; ниже в файле — ссылки *infraNodeSelector / *infraTolerations
          nodeSelector: &infraNodeSelector
            node-role.kubernetes.io/infra: ""
          tolerations: &infraTolerations
            - key: node-role.kubernetes.io/infra
              operator: Exists
              effect: NoSchedule
          resources:
            requests: {cpu: 10m, memory: 64Mi}
          webhook:
            resources:
              requests: {cpu: 10m, memory: 32Mi}
            nodeSelector: *infraNodeSelector
            tolerations: *infraTolerations
          cainjector:
            resources:
              requests: {cpu: 10m, memory: 64Mi}
            nodeSelector: *infraNodeSelector
            tolerations: *infraTolerations
          startupapicheck:
            nodeSelector: *infraNodeSelector
            tolerations: *infraTolerations

    - repoURL: http://192.168.0.21/loowpts/homelab.git
      targetRevision: main
      path: IaC/argocd/manifests/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # caBundle вебхуков проставляет cainjector
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
