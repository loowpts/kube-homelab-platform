apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "todo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "todo.selector" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
---
# Redis: кэш и rate limit, без персистентности.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "todo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "todo.selector" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "todo.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      {{- include "todo.placement" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Пароль — в конфиг, а не аргументом: иначе виден в ps на ноде
          command: ["sh", "-c"]
          args:
            - |
              umask 077
              {
                printf 'requirepass "%s"\n' "$REDIS_PASSWORD"
                printf 'maxmemory %s\n' {{ .Values.redis.maxmemory | quote }}
                printf 'maxmemory-policy allkeys-lru\n'
                printf 'save ""\n'
              } > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: password
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli --no-auth-warning ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli --no-auth-warning ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
