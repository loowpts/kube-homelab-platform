# Секреты из Vault (ClusterSecretStore vault-backend) через External Secrets.
# В Vault на окружение: <vault.path>/postgres {user, password, db}, <vault.path>/redis {password}.
# DSN не хранится отдельно — собирается из логина/пароля, чтобы не разъехаться.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
  labels:
    {{- include "todo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.vault.secretStore }}
    kind: ClusterSecretStore
  target:
    name: postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        dsn: {{`"postgres://{{ .user }}:{{ .password }}@postgres:5432/{{ .db }}?sslmode=disable"`}}
  data:
    - secretKey: user
      remoteRef:
        key: {{ include "todo.vaultPath" . }}/postgres
        property: user
    - secretKey: password
      remoteRef:
        key: {{ include "todo.vaultPath" . }}/postgres
        property: password
    - secretKey: db
      remoteRef:
        key: {{ include "todo.vaultPath" . }}/postgres
        property: db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis
  labels:
    {{- include "todo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.vault.secretStore }}
    kind: ClusterSecretStore
  target:
    name: redis
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "todo.vaultPath" . }}/redis
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.image.pullSecret }}
  labels:
    {{- include "todo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.vault.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.image.pullSecret }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {{`{"auths":{"`}}{{ include "todo.registryHost" . }}{{`":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}`}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.vault.registryKey }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ .Values.vault.registryKey }}
        property: token
